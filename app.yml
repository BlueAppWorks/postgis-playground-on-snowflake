# Snowflake App Runtime manifest (app.yml version 2) — deploy with `snow app deploy`.
#
# Coding agents (Cortex Code etc.): follow .snowflake/cortex/skills/postgis-playground-setup/SKILL.md.
# It lists the Snowflake objects that must exist first (docs/00-before-you-start.md) and the known pitfalls.
#
# Fill in the four <...> values; docs/03-deploy.md explains each field.
# Needs Snowflake CLI 3.26 or later (`snow app deploy --help` lists `--target`).
# Older CLI: see docs/03-deploy.md → "Older Snowflake CLI" (snowflake.yml.legacy-cli).
version: 2

name: POSTGIS_PLAYGROUND
database: <APPS_DATABASE>            # e.g. SNOWFLAKE_APPS (shared) or USER$ (your personal database)
schema: PUBLIC
query_warehouse: <WAREHOUSE>         # required by App Runtime; this app queries Postgres, not the warehouse

label: PostGIS Playground
description: Learn PostGIS step by step on Snowflake Postgres — every map change is a SQL query you can read.
icon: src/app/icon.svg

auto_suspend_secs: 3600              # suspend after an hour without traffic

# Outbound access: Snowflake Postgres (5432) and the OpenStreetMap APIs. Created by snowflake/setup.sql.
external_access_integrations:
  - POSTGIS_PLAYGROUND_EAI

# Mounted at /secrets/PG/username and /secrets/PG/password (read by src/server/db.ts).
# The mount name must be UPPER_CASE letters, digits and underscores.
secrets:
  - name: PG
    secret: POSTGIS_PLAYGROUND_ADMIN.CONFIG.PG_APP_CREDENTIALS

# Non-secret settings only. Never add PGPASSWORD here — the password comes from the secret above.
# PORT and HOSTNAME are set by App Runtime and must not be defined here.
environment_variables:
  - name: PGHOST
    value: "<instance-host>.postgres.snowflake.app"
  - name: PGDATABASE
    value: "postgis_playground"
  - name: OSM_USER_AGENT
    value: "PostGIS-Playground/1.0 (<your contact email or URL>)"
  - name: NEXT_TELEMETRY_DISABLED
    value: "1"
  # Optional:
  # - name: BASEMAP_STYLE_URL       # "none" draws the whole map from PostGIS tiles
  #   value: "none"
  # - name: ALLOW_SQL_CONSOLE       # "false" hides the Try-it SQL editor
  #   value: "false"

install:
  commands:
    - [npm, ci, --include=dev]       # the build needs TypeScript and the type packages
build:
  commands:
    - [npm, run, build]              # next build + scripts/prepare-standalone.mjs
    - [rm, -rf, node_modules]        # the standalone server carries its own dependencies
run:
  command: [node, .next/standalone/server.js]   # listens on $HOSTNAME:$PORT

ignore:
  - node_modules
  - .next
  - .env*
  - .git
  - snowflake.log
  - docs                             # guides and screenshots are not needed at runtime
  - .snowflake                       # Cortex Code skills
  - config/examples
